name: Feature request
description: An idea or something FluxMQ is missing
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: What do you want to do
      description: The problem or use case, not only the solution.
    validations:
      required: true
  - type: textarea
    attributes:
      label: How you do it today
      description: Workarounds, or how Kafka, RabbitMQ or another broker solves it.

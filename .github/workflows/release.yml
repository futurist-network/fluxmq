# Tag `vX.Y.Z` → image ghcr.io/<owner>/fluxmq:X.Y.Z (+ :latest) for amd64 and arm64, and a
# GitHub release with `fluxmq-linux-<arch>.tar.gz` (binary, fluxmq.toml, fluxmq.service) that
# deploy/install.sh downloads. Each arch builds natively on its own runner from the Dockerfile;
# the tarball's binary is copied out of that image.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/fluxmq

jobs:
  build:
    strategy:
      matrix:
        include:
          - { platform: linux/amd64, arch: x86_64, runner: ubuntu-24.04 }
          - { platform: linux/arm64, arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Tarball
        run: |
          mkdir -p out/fluxmq
          id=$(docker create "$IMAGE@${{ steps.image.outputs.digest }}")
          docker cp "$id:/usr/local/bin/fluxmq" out/fluxmq/
          cp deploy/fluxmq.toml deploy/fluxmq.service out/fluxmq/
          asset=fluxmq-linux-${{ matrix.arch }}.tar.gz
          tar -czf "out/$asset" -C out fluxmq
          (cd out && sha256sum "$asset" > "$asset.sha256")
          echo "${{ steps.image.outputs.digest }}" > out/digest-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}
          path: |
            out/*.tar.gz*
            out/digest-*

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          # Only the tarballs; build-push-action's own *.dockerbuild records are not zip artifacts.
          pattern: '*64'
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Multi-arch image
        run: |
          version=${GITHUB_REF_NAME#v}
          tags="-t $IMAGE:$version"
          # Pre-releases (v1.2.0-rc.1) never move :latest.
          case "$version" in *-*) ;; *) tags="$tags -t $IMAGE:latest" ;; esac
          docker buildx imagetools create $tags $(sed "s|^|$IMAGE@|" out/digest-*)
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF_NAME" in *-*) pre=--prerelease ;; *) pre= ;; esac
          # Release notes: the version's CHANGELOG.md section plus install commands.
          version=${GITHUB_REF_NAME#v}
          gh api "repos/$GITHUB_REPOSITORY/contents/CHANGELOG.md?ref=$GITHUB_REF_NAME" --jq .content \
            | base64 -d | awk -v v="$version" '/^## /{p = ($0 == "## " v || index($0, "## " v " ") == 1); next} p' > notes.md
          cat >> notes.md <<EOF

          ## Install

          \`\`\`sh
          docker run -d -p 7420:7420 -p 7421:7421 -v fluxmq:/var/lib/fluxmq $IMAGE:$version
          curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/master/deploy/install.sh | sudo sh
          \`\`\`
          EOF
          gh release create "$GITHUB_REF_NAME" out/*.tar.gz out/*.sha256 \
            --repo "$GITHUB_REPOSITORY" --title "FluxMQ $version" --notes-file notes.md $pre

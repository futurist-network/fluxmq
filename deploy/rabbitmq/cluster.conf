# 3-node RabbitMQ cluster for the `rabbitmq-cluster` profile (deploy/docker-compose.yml).
# Static peer discovery; the Erlang cookie is generated per stack by the rabbitmq-cookie init
# service into a volume (no secret in this file).
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rmq1
cluster_formation.classic_config.nodes.2 = rabbit@rmq2
cluster_formation.classic_config.nodes.3 = rabbit@rmq3
# New quorum queues get a member on every node (RF = 3, like the other 3-node systems).
quorum_queue.initial_cluster_size = 3

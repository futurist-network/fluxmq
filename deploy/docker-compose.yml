# FluxMQ, Kafka and RabbitMQ stacks for local evaluation and the comparative benchmarks.
# See deploy/README.md (English) or docs/GUIDE.ru.md section 25 (Russian).
#
#   docker compose -f deploy/docker-compose.yml --profile single up -d      # http://localhost:37421
#   docker compose -f deploy/docker-compose.yml --profile cluster up -d     # https://localhost:37431
#   docker compose -f deploy/docker-compose.yml --profile single --profile demo up -d
#   docker compose -f deploy/docker-compose.yml --profile kafka up -d
#   docker compose -f deploy/docker-compose.yml --profile rabbitmq-cluster up -d
#   docker compose -f deploy/docker-compose.yml --profile '*' down -v      # stop + delete data
#
# Profiles: single | cluster | demo | kafka | kafka-cluster | rabbitmq | rabbitmq-cluster | bench
# Host ports are in the 3xxxx range, bound to 127.0.0.1, and overridable via env (table in
# deploy/README.md). Every broker container gets the same CPU / memory limits
# (BROKER_CPUS / BROKER_MEM) so the systems compare on equal resources.
#
# No secrets in this file: the FluxMQ cluster secret and the RabbitMQ Erlang cookie are random
# per stack, generated by init services into named volumes; certificates are `gen-dev` ones,
# also only in a volume.

name: fluxmq

x-broker-resources: &broker-resources
  cpus: ${BROKER_CPUS:-2}
  mem_limit: ${BROKER_MEM:-2g}
  memswap_limit: ${BROKER_MEM:-2g}
  ulimits:
    nofile: { soft: 65536, hard: 65536 }

x-fluxmq-node: &fluxmq-node
  <<: *broker-resources
  image: ${FLUXMQ_IMAGE:-fluxmq:dev}
  restart: "no"
  depends_on:
    certs:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD", "fluxmq-healthcheck"]
    interval: 5s
    timeout: 3s
    retries: 10
    start_period: 30s
    start_interval: 1s

x-fluxmq-cluster-env: &fluxmq-cluster-env
  FLUXMQ_PEERS: n1@n1:7422,n2@n2:7422,n3@n3:7422
  FLUXMQ_CLUSTER_NAME: docker
  FLUXMQ_CLUSTER_SECRET_FILE: /certs/cluster-secret
  FLUXMQ_TLS_DIR: /certs
  FLUXMQ_TLS: ${FLUXMQ_CLUSTER_TLS:-on}
  FLUXMQ_CLIENT_MTLS: ${FLUXMQ_CLIENT_MTLS:-off}
  FLUXMQ_REPLICATION_FACTOR: ${FLUXMQ_REPLICATION_FACTOR:-3}
  FLUXMQ_MIN_ISR: ${FLUXMQ_MIN_ISR:-2}
  FLUXMQ_FSYNC: ${FLUXMQ_FSYNC:-group-commit}
  # Log segment size in bytes (empty = broker default). The bench runner sets 16 MiB, the same
  # as the Kafka topics' segment.bytes.
  FLUXMQ_SEGMENT_BYTES: ${FLUXMQ_SEGMENT_BYTES:-}
  # Pipelined group commit (on|off, empty = broker default on since v0.9; off = v0.8 behaviour)
  # and its per-partition depth (1..=16, empty = broker default 1).
  FLUXMQ_COMMIT_PIPELINE: ${FLUXMQ_COMMIT_PIPELINE:-}
  FLUXMQ_COMMIT_PIPELINE_DEPTH: ${FLUXMQ_COMMIT_PIPELINE_DEPTH:-}
  FLUXMQ_ADMIN_TOKEN: ${FLUXMQ_ADMIN_TOKEN:-}
  # Open auth unless FLUXMQ_ADMIN_TOKEN is set: a local stack, ports bound to 127.0.0.1.
  FLUXMQ_AUTH: ${FLUXMQ_AUTH:-open}
  FLUXMQ_LOG: ${FLUXMQ_LOG:-info}
  # TLS record layer (fast | ktls | classic; empty = default fast, the userspace record layer;
  # ktls = kernel TLS when the host kernel has the `tls` module, else fast).
  FLUXMQ_TLS_IMPL: ${FLUXMQ_TLS_IMPL:-}

x-kafka-env: &kafka-env
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,TLS:SSL
  # KAFKA_TLS=on adds a TLS listener on :9095 (the bench's kafka-*-tls systems). It serves
  # the stack's gen-dev server certificate (SANs include kafka, kafka1..3), the same CA the
  # FluxMQ TLS rows use; no client certificates. KAFKA_INTER_BROKER_LISTENER=TLS also moves
  # replication onto it (the 3-node TLS row, like FluxMQ's full-TLS cluster).
  KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094${KAFKA_TLS:+,TLS://:9095}
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_INTER_BROKER_LISTENER_NAME: ${KAFKA_INTER_BROKER_LISTENER:-PLAINTEXT}
  KAFKA_SSL_KEYSTORE_TYPE: PEM
  KAFKA_SSL_KEYSTORE_LOCATION: /certs/kafka-keystore.pem
  KAFKA_SSL_TRUSTSTORE_TYPE: PEM
  KAFKA_SSL_TRUSTSTORE_LOCATION: /certs/ca.pem
  KAFKA_SSL_CLIENT_AUTH: none
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  KAFKA_NUM_PARTITIONS: 8
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  # Bounded disk in benchmarks: deleted segments / topics go away after 1 s (default 60 s,
  # which at ~200 MB/s left >10 GB pending deletion per run), small segments so retention
  # can delete often, retention checked every second.
  KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 1000
  KAFKA_LOG_SEGMENT_DELETE_DELAY_MS: 1000
  KAFKA_LOG_SEGMENT_BYTES: 16777216
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  # Flush policy. Default = Kafka's own default (Long.MAX_VALUE: no fsync per message, data
  # reaches disk via the page cache). The bench's kafka-*-fsync systems set 1: the broker fsyncs
  # each partition append before answering (topics inherit it as flush.messages=1).
  KAFKA_LOG_FLUSH_INTERVAL_MESSAGES: ${KAFKA_LOG_FLUSH_INTERVAL_MESSAGES:-9223372036854775807}
  KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xms1g -Xmx1g}
  # Not a secret: KRaft needs one shared cluster id (base64 UUID) for the stack.
  CLUSTER_ID: ${KAFKA_CLUSTER_ID:-Rmx1eE1RQmVuY2hLUmFmdA}

x-kafka-node: &kafka-node
  <<: *broker-resources
  image: ${KAFKA_IMAGE:-apache/kafka:3.7.0}
  restart: "no"
  depends_on:
    certs:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
    interval: 30s
    timeout: 20s
    retries: 10
    start_period: 90s
    start_interval: 3s

x-rabbit-node: &rabbit-node
  <<: *broker-resources
  image: ${RABBITMQ_IMAGE:-rabbitmq:4.1}
  restart: "no"
  healthcheck:
    test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
    interval: 30s
    timeout: 20s
    retries: 10
    start_period: 90s
    start_interval: 3s

services:
  # ---------------------------------------------------------------- FluxMQ init: certs + secret
  certs:
    image: ${FLUXMQ_IMAGE:-fluxmq:dev}
    profiles: [single, cluster, demo, bench, kafka, kafka-cluster]
    healthcheck:
      disable: true
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ ! -s /certs/ca.pem ]; then
          fluxmq tls gen-dev --out /certs --nodes n1,n2,n3 --hosts ${FLUXMQ_CERT_HOSTS:-n1,n2,n3,fluxmq,kafka,kafka1,kafka2,kafka3,localhost,127.0.0.1}
        fi
        # Kafka's PEM key store: unencrypted PKCS#8 key + chain in one file, readable by the
        # Kafka image's user (development certificates only).
        if [ ! -s /certs/kafka-keystore.pem ]; then
          cat /certs/server-key.pem /certs/server.pem > /certs/kafka-keystore.pem
          chmod 644 /certs/kafka-keystore.pem
        fi
        if [ ! -s /certs/cluster-secret ]; then
          umask 077
          head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n' > /certs/cluster-secret
        fi
        ls -l /certs
    volumes:
      - certs:/certs

  # ---------------------------------------------------------------- FluxMQ single node
  fluxmq:
    <<: *fluxmq-node
    profiles: [single]
    hostname: fluxmq
    environment:
      FLUXMQ_ADVERTISE_HOST: fluxmq
      FLUXMQ_TLS_DIR: /certs
      FLUXMQ_TLS: ${FLUXMQ_SINGLE_TLS:-off}
      FLUXMQ_CLIENT_MTLS: ${FLUXMQ_CLIENT_MTLS:-off}
      FLUXMQ_FSYNC: ${FLUXMQ_FSYNC:-group-commit}
      FLUXMQ_SEGMENT_BYTES: ${FLUXMQ_SEGMENT_BYTES:-}
      FLUXMQ_COMMIT_PIPELINE: ${FLUXMQ_COMMIT_PIPELINE:-}
      FLUXMQ_COMMIT_PIPELINE_DEPTH: ${FLUXMQ_COMMIT_PIPELINE_DEPTH:-}
      FLUXMQ_ADMIN_TOKEN: ${FLUXMQ_ADMIN_TOKEN:-}
      FLUXMQ_AUTH: ${FLUXMQ_AUTH:-open}
      FLUXMQ_LOG: ${FLUXMQ_LOG:-info}
      FLUXMQ_TLS_IMPL: ${FLUXMQ_TLS_IMPL:-}
    volumes:
      - fluxmq-data:/var/lib/fluxmq
      - certs:/certs:ro
    ports:
      - "127.0.0.1:${FLUXMQ_CLIENT_PORT:-37420}:7420"
      - "127.0.0.1:${FLUXMQ_HTTP_PORT:-37421}:7421"

  # ---------------------------------------------------------------- FluxMQ 3-node cluster (TLS)
  n1:
    <<: *fluxmq-node
    profiles: [cluster]
    hostname: n1
    environment:
      <<: *fluxmq-cluster-env
      FLUXMQ_NODE_ID: n1
      FLUXMQ_ADVERTISE_HOST: n1
    volumes:
      - n1-data:/var/lib/fluxmq
      - certs:/certs:ro
    ports:
      - "127.0.0.1:${N1_CLIENT_PORT:-37430}:7420"
      - "127.0.0.1:${N1_HTTP_PORT:-37431}:7421"

  n2:
    <<: *fluxmq-node
    profiles: [cluster]
    hostname: n2
    environment:
      <<: *fluxmq-cluster-env
      FLUXMQ_NODE_ID: n2
      FLUXMQ_ADVERTISE_HOST: n2
    volumes:
      - n2-data:/var/lib/fluxmq
      - certs:/certs:ro
    ports:
      - "127.0.0.1:${N2_CLIENT_PORT:-37440}:7420"
      - "127.0.0.1:${N2_HTTP_PORT:-37441}:7421"

  n3:
    <<: *fluxmq-node
    profiles: [cluster]
    hostname: n3
    environment:
      <<: *fluxmq-cluster-env
      FLUXMQ_NODE_ID: n3
      FLUXMQ_ADVERTISE_HOST: n3
    volumes:
      - n3-data:/var/lib/fluxmq
      - certs:/certs:ro
    ports:
      - "127.0.0.1:${N3_CLIENT_PORT:-37450}:7420"
      - "127.0.0.1:${N3_HTTP_PORT:-37451}:7421"

  # ---------------------------------------------------------------- demo traffic
  # Targets the cluster when n1 resolves (cluster profile up), otherwise the single node.
  demo:
    image: ${FLUXMQ_IMAGE:-fluxmq:dev}
    profiles: [demo]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      certs:
        condition: service_completed_successfully
      fluxmq:
        condition: service_healthy
        required: false
      n1:
        condition: service_healthy
        required: false
    environment:
      FLUXMQ_TLS_DIR: /certs
      FLUXMQ_CLIENT_MTLS: ${FLUXMQ_CLIENT_MTLS:-off}
      FLUXMQ_TOKEN: ${FLUXMQ_TOKEN:-}
      SINGLE_TLS: ${FLUXMQ_SINGLE_TLS:-off}
      CLUSTER_TLS: ${FLUXMQ_CLUSTER_TLS:-on}
      DEMO_SPEED: ${DEMO_SPEED:-1}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if getent hosts n1 >/dev/null 2>&1; then
          s=""; [ "$$CLUSTER_TLS" = "on" ] && s="tls://"
          export FLUXMQ_SEEDS="$${s}n1:7420,$${s}n2:7420,$${s}n3:7420" FLUXMQ_TLS="$$CLUSTER_TLS"
        else
          s=""; [ "$$SINGLE_TLS" = "on" ] && s="tls://"
          export FLUXMQ_ADDR="$${s}fluxmq:7420" FLUXMQ_TLS="$$SINGLE_TLS"
        fi
        echo "demo -> $${FLUXMQ_SEEDS:-$$FLUXMQ_ADDR}"
        exec tini -- docker-entrypoint.sh fluxmq-demo --speed "$$DEMO_SPEED"
    volumes:
      - certs:/certs:ro
    cpus: ${BENCH_CPUS:-2}
    mem_limit: ${BENCH_MEM:-2g}

  # ---------------------------------------------------------------- Apache Kafka (KRaft)
  kafka:
    <<: *kafka-node
    profiles: [kafka]
    hostname: kafka
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-39092}${KAFKA_TLS:+,TLS://kafka:9095}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
      - certs:/certs:ro
    ports:
      - "127.0.0.1:${KAFKA_PORT:-39092}:9094"

  kafka1:
    <<: *kafka-node
    profiles: [kafka-cluster]
    hostname: kafka1
    environment: &kafka-cluster-env
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:9092,EXTERNAL://localhost:${KAFKA1_PORT:-39192}${KAFKA_TLS:+,TLS://kafka1:9095}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
    volumes:
      - kafka1-data:/var/lib/kafka/data
      - certs:/certs:ro
    ports:
      - "127.0.0.1:${KAFKA1_PORT:-39192}:9094"

  kafka2:
    <<: *kafka-node
    profiles: [kafka-cluster]
    hostname: kafka2
    environment:
      <<: *kafka-cluster-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:9092,EXTERNAL://localhost:${KAFKA2_PORT:-39292}${KAFKA_TLS:+,TLS://kafka2:9095}
    volumes:
      - kafka2-data:/var/lib/kafka/data
      - certs:/certs:ro
    ports:
      - "127.0.0.1:${KAFKA2_PORT:-39292}:9094"

  kafka3:
    <<: *kafka-node
    profiles: [kafka-cluster]
    hostname: kafka3
    environment:
      <<: *kafka-cluster-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka3:9092,EXTERNAL://localhost:${KAFKA3_PORT:-39392}${KAFKA_TLS:+,TLS://kafka3:9095}
    volumes:
      - kafka3-data:/var/lib/kafka/data
      - certs:/certs:ro
    ports:
      - "127.0.0.1:${KAFKA3_PORT:-39392}:9094"

  # ---------------------------------------------------------------- RabbitMQ
  # The image allows guest/guest from the network (loopback_users.guest = false); dev only.
  rabbitmq:
    <<: *rabbit-node
    profiles: [rabbitmq]
    hostname: rabbitmq
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-35672}:5672"

  rabbitmq-cookie:
    image: ${RABBITMQ_IMAGE:-rabbitmq:4.1}
    profiles: [rabbitmq-cluster]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ ! -s /cookie/.erlang.cookie ]; then
          umask 077
          head -c 48 /dev/urandom | od -An -tx1 | tr -d ' \n' > /cookie/.erlang.cookie
        fi
    volumes:
      - rabbitmq-cookie:/cookie

  rmq1: &rmq-node
    <<: *rabbit-node
    profiles: [rabbitmq-cluster]
    hostname: rmq1
    depends_on:
      rabbitmq-cookie:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "/opt/fluxmq-deploy/start.sh"]
    command: []
    volumes:
      - rmq1-data:/var/lib/rabbitmq
      - rabbitmq-cookie:/cookie:ro
      - ./rabbitmq/start.sh:/opt/fluxmq-deploy/start.sh:ro
      - ./rabbitmq/cluster.conf:/etc/rabbitmq/conf.d/30-cluster.conf:ro
    ports:
      - "127.0.0.1:${RMQ1_PORT:-35673}:5672"

  rmq2:
    <<: *rmq-node
    hostname: rmq2
    volumes:
      - rmq2-data:/var/lib/rabbitmq
      - rabbitmq-cookie:/cookie:ro
      - ./rabbitmq/start.sh:/opt/fluxmq-deploy/start.sh:ro
      - ./rabbitmq/cluster.conf:/etc/rabbitmq/conf.d/30-cluster.conf:ro
    ports:
      - "127.0.0.1:${RMQ2_PORT:-35674}:5672"

  rmq3:
    <<: *rmq-node
    hostname: rmq3
    volumes:
      - rmq3-data:/var/lib/rabbitmq
      - rabbitmq-cookie:/cookie:ro
      - ./rabbitmq/start.sh:/opt/fluxmq-deploy/start.sh:ro
      - ./rabbitmq/cluster.conf:/etc/rabbitmq/conf.d/30-cluster.conf:ro
    ports:
      - "127.0.0.1:${RMQ3_PORT:-35675}:5672"

  # ---------------------------------------------------------------- benchmark clients
  # Driven by bench/run.sh (`docker compose run --rm bench --system ...`).
  bench:
    image: ${HARNESS_IMAGE:-fluxmq-harness:dev}
    profiles: [bench]
    restart: "no"
    environment:
      # The SDK's TLS record layer (fast | classic; empty = default fast).
      FLUXMQ_TLS_IMPL: ${HARNESS_TLS_IMPL:-${FLUXMQ_TLS_IMPL:-}}
    volumes:
      - certs:/certs:ro
      - ${BENCH_RESULTS_DIR:-../bench/results}:/results
    cpus: ${BENCH_CPUS:-2}
    mem_limit: ${BENCH_MEM:-2g}
    ulimits:
      nofile: { soft: 65536, hard: 65536 }

  # fluxmq-bench from the FluxMQ image itself (v0.4 baseline vs current, batched delivery).
  fluxmq-bench:
    # FLUXMQ_BENCH_IMAGE: run another image's fluxmq-bench against this broker (the v0.5 drain
    # mode against the v0.4 baseline broker); defaults to the broker image.
    image: ${FLUXMQ_BENCH_IMAGE:-${FLUXMQ_IMAGE:-fluxmq:dev}}
    profiles: [bench]
    restart: "no"
    healthcheck:
      disable: true
    entrypoint: ["tini", "--", "docker-entrypoint.sh", "fluxmq-bench"]
    environment:
      FLUXMQ_TLS_DIR: /certs
      FLUXMQ_TLS: ${FLUXMQ_BENCH_TLS:-off}
    volumes:
      - certs:/certs:ro
    cpus: ${BENCH_CPUS:-2}
    mem_limit: ${BENCH_MEM:-2g}

volumes:
  certs:
  fluxmq-data:
  n1-data:
  n2-data:
  n3-data:
  kafka-data:
  kafka1-data:
  kafka2-data:
  kafka3-data:
  rabbitmq-data:
  rabbitmq-cookie:
  rmq1-data:
  rmq2-data:
  rmq3-data:

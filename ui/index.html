<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>FluxMQ Console</title>
    <script>
      try {
        var th = localStorage.getItem('fluxmq.theme');
        if (th === 'light' || (th !== 'dark' && window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches)) document.documentElement.dataset.theme = 'light';
      } catch (e) {}
    </script>
    <style>
      html { background: #0b0d10; }
      html[data-theme='light'] { background: #f6f7f9; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

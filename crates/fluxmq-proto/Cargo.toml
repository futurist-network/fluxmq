[package]
name = "fluxmq-proto"
description = "FluxMQ shared domain model, client wire protocol and telemetry contract"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Compression and CRC-32C for record batches. One implementation shared by broker, replication
# and SDK so they can't diverge.
codec = ["dep:crc32c", "dep:lz4_flex", "dep:zstd"]

[dependencies]
crc32c = { workspace = true, optional = true }
lz4_flex = { workspace = true, optional = true }
zstd = { workspace = true, optional = true }
bytes.workspace = true
crc32fast.workspace = true
postcard.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

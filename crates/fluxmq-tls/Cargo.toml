[package]
name = "fluxmq-tls"
description = "FluxMQ TLS: rustls (aws-lc-rs) config builders, reloadable certificates, status, dev certificates"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["server"]
# Everything the broker needs (reloadable certs, status, cluster mTLS, HTTPS serving, gen-dev).
# Without it only the client-side builder is compiled (the SDK uses that).
server = [
    "dep:axum",
    "dep:hyper",
    "dep:hyper-util",
    "dep:tower-service",
    "dep:tokio-util",
    "dep:parking_lot",
    "dep:x509-parser",
    "dep:rcgen",
    "dep:time",
    "dep:sha2",
]

[dependencies]
fluxmq-proto.workspace = true
serde_json.workspace = true
rustls = { version = "0.23.31", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1.12", features = ["std"] }
rustls-platform-verifier = "0.7"
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12", "logging"] }
thiserror.workspace = true
tokio.workspace = true
libc = "0.2"
tracing.workspace = true

axum = { workspace = true, optional = true }
hyper = { version = "1", features = ["server", "http1", "http2"], optional = true }
hyper-util = { version = "0.1.16", features = ["server", "server-auto", "server-graceful", "service", "tokio", "http1", "http2"], optional = true }
tower-service = { version = "0.3", optional = true }
tokio-util = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
x509-parser = { version = "0.18", optional = true }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "aws_lc_rs", "x509-parser"], optional = true }
time = { version = "0.3", optional = true }
sha2 = { version = "0.10", optional = true }

[dev-dependencies]
tempfile.workspace = true

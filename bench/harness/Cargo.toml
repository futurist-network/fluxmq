# Common load/latency harness for the comparative benchmarks (bench/README.md).
# Deliberately NOT a member of the FluxMQ workspace (own [workspace] table below), so the
# main `cargo build` never compiles librdkafka or lapin. Built inside Docker
# (bench/harness/Dockerfile); `cargo build --release` here works too (needs cmake + a C++
# compiler for librdkafka, plus OpenSSL headers for its TLS).
[package]
name = "mq-harness"
version = "0.5.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[[bin]]
name = "mq-harness"
path = "src/main.rs"

[dependencies]
fluxmq-client = { path = "../../crates/fluxmq-client" }
fluxmq-proto = { path = "../../crates/fluxmq-proto" }
rdkafka = { version = "0.39", default-features = false, features = ["cmake-build", "ssl", "tokio"], optional = true }
lapin = { version = "2.5", optional = true }
tokio-executor-trait = { version = "2.1", optional = true }
tokio-reactor-trait = { version = "1.1", optional = true }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
hdrhistogram = "7"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
bytes = "1"
parking_lot = "0.12"

[features]
# Kafka needs cmake + a C++ compiler (librdkafka from source). `--no-default-features
# --features rabbitmq` (or none) builds a FluxMQ-only harness natively, e.g. for local repros.
default = ["kafka", "rabbitmq"]
kafka = ["dep:rdkafka"]
rabbitmq = ["dep:lapin", "dep:tokio-executor-trait", "dep:tokio-reactor-trait"]

[profile.release]
lto = "thin"
codegen-units = 1
debug = 0
strip = "symbols"

[workspace]
